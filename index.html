<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tặng Nghi bông hoa </title>
    <style>
        :root {
            --bg-color: linear-gradient(to top, #01a2d6, #01589b, #090c15);
            --petal-color: linear-gradient(to top, #ff5100, #ffbb00);
            --center-color: radial-gradient(circle, #240e01 0%, #4e2202 60%, #140801 100%);
            --stem-color: linear-gradient(to right, #00965e, #00e676);
            --leaf-color: linear-gradient(to top, #006b3f, #009f5d);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-family: sans-serif;
            cursor: pointer;
        }

        /* Chữ gợi ý ban đầu */
        .click-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.6rem;
            font-style: italic;
            letter-spacing: 1px;
            z-index: 100;
            transition: opacity 0.5s ease;
            pointer-events: none;
            text-align: center;
            line-height: 2;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Lời chúc hiện lên khi click */
        .title {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 3rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
            z-index: 10;
            opacity: 0;
            transition: opacity 1.5s ease;
            text-align: center;
            width: 100%;
        }

        .flower {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .flower_stem {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 1.5vmin;
            height: 55vmin;
            background: var(--stem-color);
            border-top-left-radius: 1vmin;
            border-top-right-radius: 1vmin;
            z-index: 2;
        }

        .flower_leaf {
            position: absolute;
            width: 14vmin;
            height: 5.5vmin;
            background: var(--leaf-color);
            border-radius: 50% 50% 50% 50% / 50% 50% 20% 20%;
            z-index: 2;
            opacity: 0;
        }

        .active .flower_leaf--1 {
            left: calc(50% - 13vmin);
            bottom: 22vmin;
            transform: rotate(-15deg);
            transform-origin: right center;
            animation: grow-leaf 2s 1.5s forwards ease-out;
        }

        .active .flower_leaf--2 {
            left: 50%;
            bottom: 17vmin;
            transform: rotate(15deg);
            transform-origin: left center;
            animation: grow-leaf 2s 1.5s forwards ease-out;
        }

        .flower_center {
            position: absolute;
            left: 50%;
            bottom: 55vmin;
            width: 20vmin;
            height: 20vmin;
            background: var(--center-color);
            border-radius: 50%;
            transform: translate(-50%, 50%) scale(0);
            z-index: 4;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);
        }

        .active .flower_center {
            animation: open-center 2s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .flower_petal {
            position: absolute;
            left: 50%;
            bottom: 55vmin;
            z-index: 3;
            transform-origin: center bottom;
            width: 7vmin;
            height: 20vmin;
            background: var(--petal-color);
            clip-path: ellipse(50% 50% at 50% 50%);
            transform: translateX(-50%) scale(0); 
        }

        /* Hiệu ứng hoa nở so le từng cánh một */
        .active .petal--1  { animation: open-f1  1.5s 0.0s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--2  { animation: open-f2  1.5s 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--3  { animation: open-f3  1.5s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--4  { animation: open-f4  1.5s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--5  { animation: open-f5  1.5s 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--6  { animation: open-f6  1.5s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--7  { animation: open-f7  1.5s 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--8  { animation: open-f8  1.5s 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--9  { animation: open-f9  1.5s 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--10 { animation: open-f10 1.5s 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--11 { animation: open-f11 1.5s 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }
        .active .petal--12 { animation: open-f12 1.5s 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards; }

        @keyframes open-f1  { 0% { transform: translateX(-50%) rotate(0deg) scale(0); } 100% { transform: translateX(-50%) rotate(0deg) scale(1); } }
        @keyframes open-f2  { 0% { transform: translateX(-50%) rotate(30deg) scale(0); } 100% { transform: translateX(-50%) rotate(30deg) scale(1); } }
        @keyframes open-f3  { 0% { transform: translateX(-50%) rotate(60deg) scale(0); } 100% { transform: translateX(-50%) rotate(60deg) scale(1); } }
        @keyframes open-f4  { 0% { transform: translateX(-50%) rotate(90deg) scale(0); } 100% { transform: translateX(-50%) rotate(90deg) scale(1); } }
        @keyframes open-f5  { 0% { transform: translateX(-50%) rotate(120deg) scale(0); } 100% { transform: translateX(-50%) rotate(120deg) scale(1); } }
        @keyframes open-f6  { 0% { transform: translateX(-50%) rotate(150deg) scale(0); } 100% { transform: translateX(-50%) rotate(150deg) scale(1); } }
        @keyframes open-f7  { 0% { transform: translateX(-50%) rotate(180deg) scale(0); } 100% { transform: translateX(-50%) rotate(180deg) scale(1); } }
        @keyframes open-f8  { 0% { transform: translateX(-50%) rotate(210deg) scale(0); } 100% { transform: translateX(-50%) rotate(210deg) scale(1); } }
        @keyframes open-f9  { 0% { transform: translateX(-50%) rotate(240deg) scale(0); } 100% { transform: translateX(-50%) rotate(240deg) scale(1); } }
        @keyframes open-f10 { 0% { transform: translateX(-50%) rotate(270deg) scale(0); } 100% { transform: translateX(-50%) rotate(270deg) scale(1); } }
        @keyframes open-f11 { 0% { transform: translateX(-50%) rotate(300deg) scale(0); } 100% { transform: translateX(-50%) rotate(300deg) scale(1); } }
        @keyframes open-f12 { 0% { transform: translateX(-50%) rotate(330deg) scale(0); } 100% { transform: translateX(-50%) rotate(330deg) scale(1); } }

        @keyframes open-center { 100% { transform: translate(-50%, 50%) scale(1); } }
        @keyframes grow-leaf { 100% { opacity: 1; } }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .sparkle {
            position: absolute;
            background: rgba(255, 255, 200, 0.5);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0;
        }
        .active .sparkle {
            animation: float 4s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.1; }
            50% { transform: translateY(-40px) scale(1.4); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="click-hint" id="hintText">Chạm nhẹ vào màn hình đi... ✨</div>

    <audio id="bgMusic" loop src="nhac.mp3.mp3"></audio>

    <div class="title" id="webTitle">Cố lên nha Phương Nghi</div>

    <div class="flower" id="flowerContainer">
        <div class="flower_stem"></div>

        <div class="flower_petal petal--1"></div>
        <div class="flower_petal petal--2"></div>
        <div class="flower_petal petal--3"></div>
        <div class="flower_petal petal--4"></div>
        <div class="flower_petal petal--5"></div>
        <div class="flower_petal petal--6"></div>
        <div class="flower_petal petal--7"></div>
        <div class="flower_petal petal--8"></div>
        <div class="flower_petal petal--9"></div>
        <div class="flower_petal petal--10"></div>
        <div class="flower_petal petal--11"></div>
        <div class="flower_petal petal--12"></div>

        <div class="flower_center"></div>

        <div class="flower_leaf flower_leaf--1"></div>
        <div class="flower_leaf flower_leaf--2"></div>
    </div>

    <div class="sparkles">
        <div class="sparkle" style="width: 6px; height: 6px; left: 48%; bottom: 75vmin; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="width: 4px; height: 4px; left: 52%; bottom: 78vmin; animation-delay: 1.2s;"></div>
        <div class="sparkle" style="width: 5px; height: 5px; left: 50%; bottom: 72vmin; animation-delay: 2s;"></div>
        <div class="sparkle" style="width: 7px; height: 7px; left: 46%; bottom: 45vmin; animation-delay: 0.2s;"></div>
        <div class="sparkle" style="width: 5px; height: 5px; left: 54%; bottom: 38vmin; animation-delay: 1.5s;"></div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const hintText = document.getElementById('hintText');
        const webTitle = document.getElementById('webTitle');

        document.body.addEventListener('click', () => {
            // 1. Kích hoạt hiệu ứng chữ và hoa nở rộ
            hintText.style.opacity = '0'; 
            webTitle.style.opacity = '1';  
            document.body.classList.add('active'); 

            // 2. Load nhạc và thiết lập thời gian bắt đầu từ phút 1:11 (71 giây)
            music.load();
            music.currentTime = 71; 
            
            music.play().catch(error => {
                console.log("Lỗi âm thanh: ", error);
            });
        }, { once: true });
    </script>

</body>
</html>
